name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - test-environment
      - dev-environment
  pull_request:
    branches:
      - dev-environment
      - test-environment
  workflow_dispatch: # Manual prod trigger

##############################
# JOBS
##############################

jobs:
  dev:
    name: Dev – PR Checks
    if:
      github.ref == 'refs/heads/dev-environment' || github.event_name ==
      'pull_request'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check --if-present

      - name: Vitest
        run: npm run test -- --coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Playwright
        run: |
          npx playwright install --with-deps
          npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 📸 Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  test:
    name: Test – Staging
    if: github.ref == 'refs/heads/test-environment'
    runs-on: ubuntu-latest
    environment: test
    needs: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check --if-present

      - name: Setup Database
        run: npm run prisma:wipe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npm run test -- --coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Playwright
        run: |
          npx playwright install --with-deps
          npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  prod:
    name: Prod
    if:
      github.ref == 'refs/heads/master' || github.event_name ==
      'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: ${{secrets.NODE_ENV}}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
